name: Dubai SEO Specialist Pages
on:
  pull_request:
    paths: ["global/UAE/dubai/**", "config/dubai-seo-topics.json", "sitemap.xml", "tests/dubai_seo_pages.py", ".github/workflows/dubai-seo.yml"]
  push:
    branches: [main]
    paths: ["global/UAE/dubai/**", "config/dubai-seo-topics.json", "sitemap.xml", "tests/dubai_seo_pages.py", ".github/workflows/dubai-seo.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tests/dubai_seo_pages.py
